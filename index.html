<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Óscar & Alejandra · 2026</title>

<link rel="dns-prefetch" href="https://invitacionbodaoscaryalejandra2026.streamlit.app">
<link rel="preconnect" href="https://invitacionbodaoscaryalejandra2026.streamlit.app">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: #6B7C50;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* Línea V de la solapa - de esquinas superiores al centro */
  .v-line {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* Sello redondo antiguo */
  .seal {
    position: fixed;
    top: 62%;
    left: 50%;
    width: min(24vw, 24vh, 200px);
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    z-index: 10;
    animation: sealVibrate 2.8s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(20, 30, 10, 0.55))
            drop-shadow(0 4px 6px rgba(40, 30, 5, 0.4));
  }

  .seal svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Vibración periódica del sello */
  @keyframes sealVibrate {
    0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    3%   { transform: translate(-50%, -50%) rotate(-2.5deg) scale(1.03); }
    6%   { transform: translate(-50%, -50%) rotate(2.5deg) scale(1.03); }
    9%   { transform: translate(-50%, -50%) rotate(-2deg) scale(1.03); }
    12%  { transform: translate(-50%, -50%) rotate(2deg) scale(1.03); }
    15%  { transform: translate(-50%, -50%) rotate(-1deg) scale(1.02); }
    18%  { transform: translate(-50%, -50%) rotate(1deg) scale(1.02); }
    21%  { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  }

  /* Estado abriendo: el sello "salta" y se desvanece */
  body.opening { cursor: default; }

  body.opening .seal {
    animation: sealPop 0.5s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }

  @keyframes sealPop {
    0%   { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    25%  { transform: translate(-50%, -50%) scale(1.18) rotate(-3deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.4) rotate(20deg); opacity: 0; }
  }

  /* Luz a pantalla completa para la transición */
  .light {
    position: fixed;
    top: 50%; left: 50%;
    width: 0; height: 0;
    border-radius: 50%;
    background: radial-gradient(circle,
      #ffffff 0%, #fff4d6 40%, #ffd98a 70%,
      rgba(255, 200, 100, 0.5) 90%, transparent 100%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    filter: blur(2px);
  }

  .light.expand {
    animation: lightExpand 0.8s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }

  @keyframes lightExpand {
    0%   { width: 0; height: 0; opacity: 0; }
    30%  { opacity: 1; }
    100% { width: 350vmax; height: 350vmax; opacity: 1; filter: blur(0); background: #ffffff; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- La V de la solapa: empieza un poco más abajo de las esquinas -->
<svg class="v-line" viewBox="0 0 100 100" preserveAspectRatio="none">
  <line x1="0" y1="20" x2="50" y2="62"
        stroke="rgba(0,0,0,0.22)"
        stroke-width="1.5"
        vector-effect="non-scaling-stroke"/>
  <line x1="50" y1="62" x2="100" y2="20"
        stroke="rgba(0,0,0,0.22)"
        stroke-width="1.5"
        vector-effect="non-scaling-stroke"/>
</svg>

<!-- Sello redondo antiguo de bronce -->
<div class="seal" id="seal">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bronze" cx="32%" cy="28%" r="80%">
        <stop offset="0%"  stop-color="#D4B074"/>
        <stop offset="30%" stop-color="#A8843E"/>
        <stop offset="65%" stop-color="#7A5C24"/>
        <stop offset="100%" stop-color="#3E2C0E"/>
      </radialGradient>
      <radialGradient id="innerBronze" cx="35%" cy="30%" r="80%">
        <stop offset="0%"  stop-color="#B89048"/>
        <stop offset="100%" stop-color="#6B502A"/>
      </radialGradient>
    </defs>

    <!-- Cuerpo redondo con ligeras imperfecciones para look antiguo hecho a mano -->
    <path d="M 100,7
             C 132,8 158,22 175,46
             C 190,68 196,98 189,127
             C 182,156 159,180 130,189
             C 100,196 67,188 44,168
             C 21,147 9,117 13,86
             C 18,55 39,28 69,15
             C 79,10 90,8 100,7 Z"
          fill="url(#bronze)"
          stroke="#2D1F08" stroke-width="0.6" stroke-opacity="0.55"/>

    <!-- Anillo interior fino -->
    <circle cx="100" cy="100" r="72"
            fill="none"
            stroke="#5A4318" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Círculo interior estampado -->
    <circle cx="100" cy="100" r="68" fill="url(#innerBronze)"/>

    <!-- Sombra sutil de profundidad -->
    <circle cx="100" cy="100" r="68"
            fill="none"
            stroke="#2D1F08" stroke-width="2.5" stroke-opacity="0.13"/>

    <!-- A&O en caligrafía Allura, embossed -->
    <text x="100" y="128"
          font-family="'Allura', cursive"
          font-size="76"
          fill="#4A3614"
          text-anchor="middle"
          style="filter: drop-shadow(1.5px 1.5px 0 rgba(15,8,0,0.6)) drop-shadow(-1px -1px 0 rgba(215,175,120,0.5));">A&amp;O</text>
  </svg>
</div>

<!-- Capa de luz para la transición -->
<div class="light" id="light"></div>

<script>
  const seal = document.getElementById('seal');
  const light = document.getElementById('light');
  const DESTINATION = 'invitacion.html';

  let opened = false;

  // Prefetch de la página de invitación
  const prefetch = document.createElement('link');
  prefetch.rel = 'prefetch';
  prefetch.href = DESTINATION;
  document.head.appendChild(prefetch);

  function openInvitation() {
    if (opened) return;
    opened = true;
    document.body.classList.add('opening');
    setTimeout(() => light.classList.add('expand'), 300);
    setTimeout(() => { window.location.href = DESTINATION; }, 950);
  }

  document.body.addEventListener('click', openInvitation);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openInvitation();
    }
  });
</script>

</body>
</html>
