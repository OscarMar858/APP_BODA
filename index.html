<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Óscar & Alejandra · 2026</title>

<link rel="dns-prefetch" href="https://invitacionbodaoscaryalejandra2026.streamlit.app">
<link rel="preconnect" href="https://invitacionbodaoscaryalejandra2026.streamlit.app">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;500&family=Italiana&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #EDE6D6;
    --olive: #6B7C50;
    --olive-shadow: rgba(60, 75, 35, 0.40);
    --envelope-inner: #3A4528;
    --ink: #4A4530;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--paper);
    background-image: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.1) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    width: min(85vw, 85vh, 520px);
    aspect-ratio: 1 / 1;
    perspective: 1500px;
    cursor: pointer;
  }

  .envelope {
    position: absolute;
    inset: 0;
    border-radius: 4px;
    box-shadow: 0 30px 60px -20px var(--olive-shadow),
                0 15px 30px -10px var(--olive-shadow);
    transform-style: preserve-3d;
  }

  .envelope-back {
    position: absolute;
    inset: 0;
    background: var(--envelope-inner);
    border-radius: 4px;
    overflow: hidden;
  }

  .light-source {
    position: absolute;
    top: 0; left: 50%;
    transform: translate(-50%, -100%) scale(0);
    width: 40%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: radial-gradient(circle,
      #ffffff 0%, #fff4d6 30%, #ffd98a 55%,
      rgba(255, 200, 100, 0.4) 75%, transparent 100%);
    filter: blur(8px);
    opacity: 0;
    pointer-events: none;
  }

  /* Bolsillo frontal — verde oliva plano */
  .envelope-front {
    position: absolute;
    inset: 0;
    background: var(--olive);
    border-radius: 4px;
    clip-path: polygon(0 50%, 50% 100%, 100% 50%, 100% 100%, 0 100%);
    z-index: 3;
  }
  .envelope-front::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 49.5%, rgba(0,0,0,0.09) 50%, transparent 50.5%),
      linear-gradient(225deg, transparent 49.5%, rgba(0,0,0,0.09) 50%, transparent 50.5%);
    clip-path: polygon(0 50%, 50% 100%, 100% 50%, 100% 100%, 0 100%);
  }

  /* Solapa - mismo verde plano */
  .flap {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 50%;
    background: var(--olive);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 1.1s cubic-bezier(0.7, 0, 0.3, 1);
    z-index: 4;
  }
  .flap::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 49.5%, rgba(0,0,0,0.1) 50%, transparent 50.5%),
      linear-gradient(225deg, transparent 49.5%, rgba(0,0,0,0.1) 50%, transparent 50.5%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }

  /* Sello dorado */
  .seal-wrapper {
    position: absolute;
    top: 50%; left: 50%;
    width: 26%;
    aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    z-index: 5;
    animation: sealVibrate 2.8s ease-in-out infinite;
  }

  /* Vibración periódica del sello — sacudida corta cada 2.8s */
  @keyframes sealVibrate {
    0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    3%   { transform: translate(-50%, -50%) rotate(-2.5deg) scale(1.03); }
    6%   { transform: translate(-50%, -50%) rotate(2.5deg) scale(1.03); }
    9%   { transform: translate(-50%, -50%) rotate(-2deg) scale(1.03); }
    12%  { transform: translate(-50%, -50%) rotate(2deg) scale(1.03); }
    15%  { transform: translate(-50%, -50%) rotate(-1deg) scale(1.02); }
    18%  { transform: translate(-50%, -50%) rotate(1deg) scale(1.02); }
    21%  { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  }

  .seal-half {
    position: absolute;
    inset: 0;
    transition: transform 0.7s cubic-bezier(0.5, 0, 0.5, 1),
                opacity 0.7s ease;
  }

  .seal-half svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 12px rgba(30, 40, 15, 0.45))
            drop-shadow(0 2px 3px rgba(50, 35, 5, 0.4));
  }

  .fullscreen-light {
    position: fixed;
    top: 50%; left: 50%;
    width: 0; height: 0;
    border-radius: 50%;
    background: radial-gradient(circle,
      #ffffff 0%, #fffaf0 40%, #ffe9b8 70%,
      rgba(255, 220, 150, 0.8) 90%, transparent 100%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    filter: blur(2px);
  }

  /* ESTADO ABRIENDO */
  .stage.opening { cursor: default; }

  .stage.opening .seal-wrapper {
    animation: none;
    transform: translate(-50%, -50%);
  }

  .stage.opening .seal-half.left {
    transform: translateX(-30%) rotate(-35deg) translateY(20%);
    opacity: 0;
  }
  .stage.opening .seal-half.right {
    transform: translateX(30%) rotate(35deg) translateY(20%);
    opacity: 0;
  }

  .stage.opening .flap {
    transform: rotateX(180deg);
    transition-delay: 0.4s;
  }

  .stage.opening .light-source {
    animation: lightGrow 1.3s ease-out 1.1s forwards;
  }

  @keyframes lightGrow {
    0%   { opacity: 0; transform: translate(-50%, 50%) scale(0.3); }
    30%  { opacity: 1; transform: translate(-50%, 30%) scale(1.5); }
    100% { opacity: 1; transform: translate(-50%, 0%) scale(3.5); }
  }

  .fullscreen-light.expand {
    animation: fullscreenFlash 1.2s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }

  @keyframes fullscreenFlash {
    0%   { width: 0; height: 0; opacity: 0; }
    40%  { opacity: 1; }
    100% { width: 350vmax; height: 350vmax; opacity: 1; filter: blur(0); background: #ffffff; }
  }

  @media (max-width: 480px) {
    .stage { width: min(82vw, 82vh, 400px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="stage" id="stage" role="button" tabindex="0" aria-label="Abrir invitación">
  <div class="envelope">
    <div class="envelope-back">
      <div class="light-source"></div>
    </div>
    <div class="envelope-front"></div>
    <div class="flap"></div>

    <div class="seal-wrapper">
      <!-- MITAD IZQUIERDA -->
      <div class="seal-half left">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="goldL" cx="32%" cy="28%" r="80%">
              <stop offset="0%"  stop-color="#D4B074"/>
              <stop offset="30%" stop-color="#A8843E"/>
              <stop offset="65%" stop-color="#7A5C24"/>
              <stop offset="100%" stop-color="#3E2C0E"/>
            </radialGradient>
            <radialGradient id="innerGoldL" cx="35%" cy="30%" r="80%">
              <stop offset="0%"  stop-color="#B89048"/>
              <stop offset="100%" stop-color="#6B502A"/>
            </radialGradient>
            <clipPath id="clipL">
              <rect x="0" y="0" width="100" height="200"/>
            </clipPath>
          </defs>

          <g clip-path="url(#clipL)">
            <!-- Forma 4-lóbulos clásica de sello de cera -->
            <path d="M 100,5
                     Q 145,5 155,45
                     Q 195,55 195,100
                     Q 195,145 155,155
                     Q 145,195 100,195
                     Q 55,195 45,155
                     Q 5,145 5,100
                     Q 5,55 45,45
                     Q 55,5 100,5 Z"
                  fill="url(#goldL)"
                  stroke="#2D1F08" stroke-width="0.6" stroke-opacity="0.55"/>

            <!-- Anillo interior fino -->
            <circle cx="100" cy="100" r="73"
                    fill="none"
                    stroke="#5A4318" stroke-width="1.2" stroke-opacity="0.5"/>

            <!-- Círculo interior (la zona estampada) -->
            <circle cx="100" cy="100" r="69" fill="url(#innerGoldL)"/>

            <!-- Sombra sutil de profundidad en el círculo interior -->
            <circle cx="100" cy="100" r="69"
                    fill="none"
                    stroke="#2D1F08" stroke-width="2.5" stroke-opacity="0.13"/>

            <!-- A&O en caligrafía Allura, embossed -->
            <text x="100" y="128"
                  font-family="'Allura', 'Pinyon Script', cursive"
                  font-size="76"
                  fill="#4A3614"
                  text-anchor="middle"
                  style="filter: drop-shadow(1.5px 1.5px 0 rgba(15,8,0,0.6)) drop-shadow(-1px -1px 0 rgba(215,175,120,0.5));">A&amp;O</text>
          </g>
        </svg>
      </div>

      <!-- MITAD DERECHA -->
      <div class="seal-half right">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="goldR" cx="32%" cy="28%" r="80%">
              <stop offset="0%"  stop-color="#D4B074"/>
              <stop offset="30%" stop-color="#A8843E"/>
              <stop offset="65%" stop-color="#7A5C24"/>
              <stop offset="100%" stop-color="#3E2C0E"/>
            </radialGradient>
            <radialGradient id="innerGoldR" cx="35%" cy="30%" r="80%">
              <stop offset="0%"  stop-color="#B89048"/>
              <stop offset="100%" stop-color="#6B502A"/>
            </radialGradient>
            <clipPath id="clipR">
              <rect x="100" y="0" width="100" height="200"/>
            </clipPath>
          </defs>

          <g clip-path="url(#clipR)">
            <path d="M 100,5
                     Q 145,5 155,45
                     Q 195,55 195,100
                     Q 195,145 155,155
                     Q 145,195 100,195
                     Q 55,195 45,155
                     Q 5,145 5,100
                     Q 5,55 45,45
                     Q 55,5 100,5 Z"
                  fill="url(#goldR)"
                  stroke="#2D1F08" stroke-width="0.6" stroke-opacity="0.55"/>

            <circle cx="100" cy="100" r="73"
                    fill="none"
                    stroke="#5A4318" stroke-width="1.2" stroke-opacity="0.5"/>

            <circle cx="100" cy="100" r="69" fill="url(#innerGoldR)"/>

            <circle cx="100" cy="100" r="69"
                    fill="none"
                    stroke="#2D1F08" stroke-width="2.5" stroke-opacity="0.13"/>

            <text x="100" y="128"
                  font-family="'Allura', 'Pinyon Script', cursive"
                  font-size="76"
                  fill="#4A3614"
                  text-anchor="middle"
                  style="filter: drop-shadow(1.5px 1.5px 0 rgba(15,8,0,0.6)) drop-shadow(-1px -1px 0 rgba(215,175,120,0.5));">A&amp;O</text>
          </g>
        </svg>
      </div>
    </div>
  </div>
</div>

<div class="fullscreen-light" id="fsLight"></div>

<script>
  const stage = document.getElementById('stage');
  const fsLight = document.getElementById('fsLight');
  const DESTINATION = 'https://invitacionbodaoscaryalejandra2026.streamlit.app/';

  let opened = false;

  const prefetchLink = document.createElement('link');
  prefetchLink.rel = 'prefetch';
  prefetchLink.href = DESTINATION;
  document.head.appendChild(prefetchLink);

  function warmupStreamlit() {
    const warmer = document.createElement('iframe');
    warmer.src = DESTINATION;
    warmer.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;';
    document.body.appendChild(warmer);
  }
  window.addEventListener('load', warmupStreamlit);

  function openEnvelope() {
    if (opened) return;
    opened = true;
    stage.classList.add('opening');
    setTimeout(() => { fsLight.classList.add('expand'); }, 1700);
    setTimeout(() => { window.location.href = DESTINATION; }, 2800);
  }

  stage.addEventListener('click', openEnvelope);
  stage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openEnvelope();
    }
  });
</script>

</body>
</html>
