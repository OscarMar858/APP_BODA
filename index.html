<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Óscar & Alejandra · 2026</title>

<link rel="dns-prefetch" href="https://invitacionbodaoscaryalejandra2026.streamlit.app">
<link rel="preconnect" href="https://invitacionbodaoscaryalejandra2026.streamlit.app">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: #6B7C50;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* Línea V de la solapa - de esquinas superiores al centro */
  .v-line {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* Sello redondo antiguo */
  .seal {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(38vw, 38vh, 320px);
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    z-index: 10;
    animation: sealVibrate 2.8s ease-in-out infinite;
    filter: drop-shadow(0 3px 5px rgba(20, 30, 10, 0.35))
            drop-shadow(0 1px 2px rgba(40, 30, 5, 0.25));
  }

  .seal img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  /* Vibración periódica del sello */
  @keyframes sealVibrate {
    0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    3%   { transform: translate(-50%, -50%) rotate(-2.5deg) scale(1.03); }
    6%   { transform: translate(-50%, -50%) rotate(2.5deg) scale(1.03); }
    9%   { transform: translate(-50%, -50%) rotate(-2deg) scale(1.03); }
    12%  { transform: translate(-50%, -50%) rotate(2deg) scale(1.03); }
    15%  { transform: translate(-50%, -50%) rotate(-1deg) scale(1.02); }
    18%  { transform: translate(-50%, -50%) rotate(1deg) scale(1.02); }
    21%  { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  }

  /* Estado abriendo: el sello "salta" y se desvanece */
  body.opening { cursor: default; }

  body.opening .seal {
    animation: sealPop 0.5s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }

  @keyframes sealPop {
    0%   { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    25%  { transform: translate(-50%, -50%) scale(1.18) rotate(-3deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.4) rotate(20deg); opacity: 0; }
  }

  /* Luz a pantalla completa para la transición */
  .light {
    position: fixed;
    top: 50%; left: 50%;
    width: 0; height: 0;
    border-radius: 50%;
    background: radial-gradient(circle,
      #ffffff 0%, #fff4d6 40%, #ffd98a 70%,
      rgba(255, 200, 100, 0.5) 90%, transparent 100%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    filter: blur(2px);
  }

  .light.expand {
    animation: lightExpand 0.8s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }

  @keyframes lightExpand {
    0%   { width: 0; height: 0; opacity: 0; }
    30%  { opacity: 1; }
    100% { width: 350vmax; height: 350vmax; opacity: 1; filter: blur(0); background: #ffffff; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- Línea divisoria horizontal en el medio - el sello la rompe visualmente -->
<svg class="v-line" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <filter id="lineShadow" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.4"/>
      <feOffset dy="0.5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="50" x2="100" y2="50"
        stroke="rgba(0,0,0,0.32)"
        stroke-width="3"
        filter="url(#lineShadow)"
        vector-effect="non-scaling-stroke"/>
</svg>

<!-- Sello (imagen real con A&O y corazón) -->
<div class="seal" id="seal">
  <img src="sello.png" alt="Sello A&amp;O">
</div>

<!-- Capa de luz para la transición -->
<div class="light" id="light"></div>

<script>
  const seal = document.getElementById('seal');
  const light = document.getElementById('light');
  const DESTINATION = 'invitacion.html';

  let opened = false;

  // Prefetch de la página de invitación
  const prefetch = document.createElement('link');
  prefetch.rel = 'prefetch';
  prefetch.href = DESTINATION;
  document.head.appendChild(prefetch);

  function openInvitation() {
    if (opened) return;
    opened = true;
    document.body.classList.add('opening');
    setTimeout(() => light.classList.add('expand'), 300);
    setTimeout(() => { window.location.href = DESTINATION; }, 950);
  }

  document.body.addEventListener('click', openInvitation);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openInvitation();
    }
  });
</script>

</body>
</html>
